<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8" />
  <title>Météo (Open-Meteo + Géocodage)</title>
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <style>
    body { font-family: system-ui, Arial, sans-serif; margin: 2rem; }
    .card { max-width: 520px; border: 1px solid #ddd; border-radius: 12px; padding: 16px; box-shadow: 0 2px 10px rgba(0,0,0,.06); }
    .row { display: flex; gap: 12px; align-items: baseline; margin: 6px 0; }
    .label { width: 140px; color: #555; }
    #status { margin: 8px 0 16px; color: #666; }
    input { padding: 8px; border-radius: 8px; border: 1px solid #ccc; }
    button { padding: 8px 12px; border-radius: 8px; border: 1px solid #888; background: #fafafa; cursor: pointer; }
    button:hover { background: #f0f0f0; }
  </style>
</head>
<body>
  <h1>Exercice météo avec Open-Meteo</h1>

  <div class="card">
    <div class="row">
      <input id="city" type="text" placeholder="Ville (ex : Paris)" value="Paris" />
      <button id="go">Chercher</button>
    </div>
    <div id="status">Prêt.</div>

    <div id="result" hidden>
      <h2 id="place"></h2>
      <div class="row"><div class="label">Température :</div><div id="temp"></div></div>
      <div class="row"><div class="label">Humidité :</div><div id="humidity"></div></div>
      <div class="row"><div class="label">Vent :</div><div id="wind"></div></div>
      <div class="row"><div class="label">Conditions :</div><div id="desc"></div></div>
      <small id="meta"></small>
    </div>
  </div>

  <script>
    // Traduction très simple des weather codes Open-Meteo (extrait utile pour la démo)
    const WMO_DESC_FR = {
      0: "Ciel dégagé",
      1: "Plutôt clair",
      2: "Partiellement nuageux",
      3: "Couvert",
      45: "Brouillard",
      48: "Brouillard givrant",
      51: "Bruine légère",
      53: "Bruine modérée",
      55: "Bruine forte",
      61: "Pluie faible",
      63: "Pluie modérée",
      65: "Pluie forte",
      71: "Neige faible",
      73: "Neige modérée",
      75: "Neige forte",
      80: "Averses faibles",
      81: "Averses modérées",
      82: "Averses fortes",
      95: "Orages",
      96: "Orages avec grêle légère",
      99: "Orages avec grêle forte"
    };

    const statusEl = document.getElementById("status");
    const resultEl = document.getElementById("result");
    const placeEl = document.getElementById("place");
    const tempEl = document.getElementById("temp");
    const humidityEl = document.getElementById("humidity");
    const windEl = document.getElementById("wind");
    const descEl = document.getElementById("desc");
    const metaEl = document.getElementById("meta");

    document.getElementById("go").addEventListener("click", () => {
      const city = document.getElementById("city").value.trim();
      if (!city) {
        alert("Entre un nom de ville.");
        return;
      }
      getWeatherForCity(city);
    });

    // Lance une recherche au chargement pour "Paris"
    window.addEventListener("DOMContentLoaded", () => getWeatherForCity("Paris"));

    async function getWeatherForCity(cityName) {
      try {
        statusEl.textContent = "Géocodage en cours…";

        // 1) Géocoder la ville (ton URL, en français, 1 résultat)
        const geoUrl = `https://geocoding-api.open-meteo.com/v1/search?name=${encodeURIComponent(cityName)}&count=1&language=fr&format=json`;
        const geoRes = await fetch(geoUrl);
        if (!geoRes.ok) throw new Error("Échec du géocodage");
        const geoData = await geoRes.json();

        if (!geoData.results || geoData.results.length === 0) {
          throw new Error("Aucun résultat pour cette ville.");
        }

        const place = geoData.results[0];
        const { latitude, longitude, name, country, admin1 } = place;

        statusEl.textContent = "Récupération de la météo…";

        // 2) Appel météo actuelle
        const meteoUrl = new URL("https://api.open-meteo.com/v1/forecast");
        meteoUrl.searchParams.set("latitude", latitude);
        meteoUrl.searchParams.set("longitude", longitude);
        meteoUrl.searchParams.set("current", "temperature_2m,relative_humidity_2m,wind_speed_10m,weather_code");
        meteoUrl.searchParams.set("timezone", "auto");

        const meteoRes = await fetch(meteoUrl.toString());
        if (!meteoRes.ok) throw new Error("Échec de la récupération météo");
        const meteoData = await meteoRes.json();

        // 3) Affichage
        const cur = meteoData.current;
        const t = cur?.temperature_2m;
        const h = cur?.relative_humidity_2m;
        const w = cur?.wind_speed_10m;
        const code = cur?.weather_code;

        placeEl.textContent = `${name}${admin1 ? " • " + admin1 : ""} • ${country || ""}`.trim();
        tempEl.textContent = (t !== undefined) ? `${t} °C` : "—";
        humidityEl.textContent = (h !== undefined) ? `${h} %` : "—";
        windEl.textContent = (w !== undefined) ? `${w} km/h` : "—";
        descEl.textContent = WMO_DESC_FR[code] || `Code météo ${code}`;

        metaEl.textContent = `Coordonnées: ${latitude.toFixed(4)}, ${longitude.toFixed(4)} • Fuseau: ${meteoData.timezone}`;

        resultEl.hidden = false;
        statusEl.textContent = "OK";
      } catch (err) {
        console.error(err);
        statusEl.textContent = "Erreur : " + err.message;
        resultEl.hidden = true;
      }
    }
  </script>
</body>
</html>
